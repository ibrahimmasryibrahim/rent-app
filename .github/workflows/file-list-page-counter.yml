name: Build FILE LIST & PAGE COUNTER

# Builds the Windows desktop tool on a GitHub-hosted Windows machine and
# publishes the ready-to-run EXE as a downloadable artifact, so no local
# .NET installation is needed to get a working build.

on:
  push:
    branches:
      - claude/file-list-page-counter-vsfr5s
    paths:
      - 'tools/FileListPageCounter/**'
      - '.github/workflows/file-list-page-counter.yml'
  workflow_dispatch:

permissions:
  # Needed to publish the built EXE as a release asset. Release assets can be
  # downloaded without signing in to GitHub; workflow artifacts cannot.
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: tools/FileListPageCounter

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FileListPageCounter.sln

      - name: Build
        run: dotnet build FileListPageCounter.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/FileListPageCounter.Tests/FileListPageCounter.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish a self-contained single-file EXE
        run: >
          dotnet publish src/FileListPageCounter.App/FileListPageCounter.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Upload the EXE as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileListPageCounter-windows-x64
          path: tools/FileListPageCounter/publish/
          if-no-files-found: error

      - name: Package the EXE for the release
        run: Compress-Archive -Path publish/* -DestinationPath FileListPageCounter-windows-x64.zip -Force

      - name: Publish a release anyone can download without signing in
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A stable tag keeps the download link working forever; the title carries no version
          # number so it can never disagree with what the zip actually contains.
          $tag = 'file-list-page-counter-v1.0.0'
          $title = 'FILE LIST & PAGE COUNTER — أحدث إصدار'
          $notes = "استخراج أسماء الملفات وعدد الصفحات`nتطوير: Ibrahim Masry Ibrahim`n`nنزّل FileListPageCounter-windows-x64.zip من الأسفل، فُكّ الضغط، ثم شغّل FileListPageCounter.exe.`nيعمل على Windows 10/11 (64-bit) بدون تثبيت أي شيء.`n`nآخر تحديث من الالتزام $env:GITHUB_SHA"
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag FileListPageCounter-windows-x64.zip --clobber
              gh release edit $tag --title $title --notes $notes --target $env:GITHUB_SHA
          } else {
              gh release create $tag FileListPageCounter-windows-x64.zip --title $title --notes $notes --target $env:GITHUB_SHA
          }
